name: Build LuaJIT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # Linux x64 native build
  # ============================================================
  build-linux-x64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build LuaJIT
        run: |
          cd src
          make
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/bin output/lib output/include output/share
          cp src/luajit output/bin/ 2>/dev/null || true
          cp src/libluajit*.so* output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-x64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # macOS builds (Intel via macos-15-intel, ARM64 via macos-latest)
  # MACOSX_DEPLOYMENT_TARGET is required per the docs.
  # macOS ARM64 runners may queue for a long time due to
  # capacity constraints on GitHub's side.
  # ============================================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel   # Intel runner
            target: osx-x64
          - os: macos-latest     # ARM64 runner
            target: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build LuaJIT
        run: |
          cd src
          make TARGET_SYS=Darwin
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Collect artifacts
        run: |
          mkdir -p output/bin output/lib output/include output/share
          cp src/luajit output/bin/ 2>/dev/null || true
          cp src/libluajit*.dylib output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.target }}
          path: output/
          if-no-files-found: warn

  # ============================================================
  # Linux ARM64 cross-compilation
  # 32-bit ARM removed: gcc-multilib and gcc-arm-linux-gnueabihf
  # cannot coexist on Ubuntu (bug #1300211), making the required
  # HOST_CC="gcc -m32" impossible.
  # ============================================================
  build-linux-arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build LuaJIT
        run: |
          cd src
          make CROSS=aarch64-linux-gnu-
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include output/share
          cp src/libluajit*.a output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-arm64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # Android ARM64 cross-compilation using NDK
  # 32-bit Android ARM removed: LuaJIT requires matching pointer
  # sizes (HOST_CC="gcc -m32"), which conflicts with the multilib
  # requirement on Ubuntu. Modern NDK also removed GCC.
  # ============================================================
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Build LuaJIT for Android ARM64
        run: |
          cd src
          NDKBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make \
            CROSS="$NDKBIN/aarch64-linux-android-" \
            STATIC_CC="$NDKBIN/aarch64-linux-android21-clang" \
            DYNAMIC_CC="$NDKBIN/aarch64-linux-android21-clang -fPIC" \
            TARGET_LD="$NDKBIN/aarch64-linux-android21-clang" \
            TARGET_AR="$NDKBIN/llvm-ar rcus" \
            TARGET_STRIP="$NDKBIN/llvm-strip"
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include output/share
          cp src/libluajit*.a output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-android-arm64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # iOS build (interpreter only)
  # JIT is disabled on iOS because regular iOS apps are not
  # allowed to generate code at runtime.
  # ============================================================
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build LuaJIT for iOS
        run: |
          cd src
          ISDKP=$(xcrun --sdk iphoneos --show-sdk-path)
          ICC=$(xcrun --sdk iphoneos --find clang)
          make DEFAULT_CC=clang CROSS="$(dirname $ICC)/" \
               TARGET_FLAGS="-arch arm64 -isysroot $ISDKP" \
               TARGET_SYS=iOS
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include output/share
          cp src/libluajit*.a output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-ios-arm64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # Windows builds using MSVC
  # Run msvcbuild.bat from a Native Tools Command Prompt
  # for the appropriate target architecture.
  # ============================================================
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            arch: x64
          - target: win-x86
            arch: x86

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build LuaJIT
        run: |
          cd src
          .\msvcbuild.bat
        shell: cmd

      - name: Collect artifacts
        run: |
          mkdir output
          mkdir output\bin output\lib output\include output\share
          copy src\luajit.exe output\bin\ 2>nul || true
          copy src\lua51.dll output\bin\ 2>nul || true
          copy src\lua51.lib output\lib\ 2>nul || true
          copy src\luajit.lib output\lib\ 2>nul || true
          copy src\luajit.h output\include\ 2>nul || true
          xcopy /E /I src\jit output\share\jit 2>nul || true
          dir /S output
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.target }}
          path: output\
          if-no-files-found: warn
