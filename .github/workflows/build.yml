name: Build LuaJIT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # POSIX native (Linux x64) — docs: make && make install
  # ============================================================
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LuaJIT
        run: |
          cd src
          make
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/bin output/lib output/include output/share
          cp src/luajit output/bin/ 2>/dev/null || true
          cp src/libluajit*.so* output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-x64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # macOS — docs: MACOSX_DEPLOYMENT_TARGET=XX.YY make
  # ============================================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: osx-x64
          - os: macos-latest
            target: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build LuaJIT
        run: |
          cd src
          make
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Collect artifacts
        run: |
          mkdir -p output/bin output/lib output/include output/share
          cp src/luajit output/bin/ 2>/dev/null || true
          cp src/libluajit*.so* output/lib/ 2>/dev/null || true
          cp src/libluajit*.dylib output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.target }}
          path: output/
          if-no-files-found: warn

  # ============================================================
  # Linux ARM64 — docs: make CROSS=aarch64-linux-gnu-
  # ============================================================
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build LuaJIT
        run: |
          cd src
          make CROSS=aarch64-linux-gnu-
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include output/share
          cp src/libluajit*.a output/lib/ 2>/dev/null || true
          cp src/libluajit*.so* output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-arm64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # Android ARM64 — docs: NDK cross-compile
  # ============================================================
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Build LuaJIT for Android ARM64
        run: |
          cd src
          NDKDIR=$ANDROID_NDK_HOME
          NDKBIN=$NDKDIR/toolchains/llvm/prebuilt/linux-x86_64/bin
          NDKCROSS=$NDKBIN/aarch64-linux-android-
          NDKCC=$NDKBIN/aarch64-linux-android21-clang
          make CROSS=$NDKCROSS \
               STATIC_CC=$NDKCC DYNAMIC_CC="$NDKCC -fPIC" \
               TARGET_LD=$NDKCC TARGET_AR="$NDKBIN/llvm-ar rcus" \
               TARGET_STRIP=$NDKBIN/llvm-strip
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include output/share
          cp src/libluajit*.a output/lib/ 2>/dev/null || true
          cp src/libluajit*.so* output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-android-arm64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # iOS — docs: DEFAULT_CC=clang CROSS=... TARGET_SYS=iOS
  # ============================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LuaJIT for iOS
        run: |
          cd src
          ISDKP=$(xcrun --sdk iphoneos --show-sdk-path)
          ICC=$(xcrun --sdk iphoneos --find clang)
          ISDKF="-arch arm64 -isysroot $ISDKP"
          make DEFAULT_CC=clang CROSS="$(dirname $ICC)/" \
               TARGET_FLAGS="$ISDKF" TARGET_SYS=iOS
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include output/share
          cp src/libluajit*.a output/lib/ 2>/dev/null || true
          cp src/libluajit*.so* output/lib/ 2>/dev/null || true
          cp src/luajit.h output/include/ 2>/dev/null || true
          cp -r src/jit output/share/ 2>/dev/null || true
          ls -R output
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-ios-arm64
          path: output/
          if-no-files-found: warn

  # ============================================================
  # Windows — docs: cd src && msvcbuild
  # ============================================================
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            arch: x64
          - target: win-x86
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build LuaJIT
        run: |
          cd src
          .\msvcbuild.bat
        shell: cmd

      - name: Collect artifacts
        run: |
          mkdir output
          mkdir output\bin output\lib output\include output\share
          copy src\luajit.exe output\bin\ 2>nul || true
          copy src\lua51.dll output\bin\ 2>nul || true
          copy src\lua51.lib output\lib\ 2>nul || true
          copy src\luajit.lib output\lib\ 2>nul || true
          copy src\luajit.h output\include\ 2>nul || true
          xcopy /E /I src\jit output\share\jit 2>nul || true
          dir /S output
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.target }}
          path: output\
          if-no-files-found: warn
